<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dandys World Main % Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="background"></div>

    <div class="container">

        <div class="row" style="margin-top: 50px;">

            <div class="container-css">

                <div>
                    <img src="imgs/gameLogo.webp" alt="" class="img-fluid">
                </div>

                <h2 class="texto" style="font-size: 55px;">Main % Tracker</h2>

                <br>

                <i class="creator-text">Created by: aqueletaldeRaz</i>

            </div>

        </div>

        <div class="row container-css" style="margin-top: 20px;">

            <h2 class="texto" style="font-size: 45px; margin-bottom: 30px; margin-top: 15px;">Command Panel</h2>

            <div class="container-css col-md-6" style="margin-left: 30px; margin-right: 80px; margin-bottom: 70px;">

                <br>

                <div class="capsule-wrapper" id="capsuleWrapper">
                    <div class="progress-fill" id="progressBar"></div>
                        <img src="imgs/capsule.png" class="capsule" alt="Capsule">
                    <div class="capsule-number" id="capsuleNumber">0%</div>
                </div>
                
                <p id="percentage" class="percentage"></p>

                <br>

                <h2 class="texto" style="font-size: 55px;">Current Floor: <span id="floor">0</span></h2>

                <br>

                <button type="button" onclick="prevFloor()" class="btn btn-css btn-danger">
 
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-caret-left-fill" viewBox="0 0 16 16">
                        <path d="m3.86 8.753 5.482 4.796c.646.566 1.658.106 1.658-.753V3.204a1 1 0 0 0-1.659-.753l-5.48 4.796a1 1 0 0 0 0 1.506z"/>
                    </svg>
                        
                </button>

                <button type="button" onclick="resetFloor()" class="btn btn-css btn-warning" style="color: white;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-counterclockwise" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2z"/>
                        <path d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466"/>
                    </svg>
                </button>

                <button type="button" onclick="nextFloor()" class="btn btn-css btn-success">

                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-caret-right-fill" viewBox="0 0 16 16">
                        <path d="m12.14 8.753-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z"/>
                    </svg>

                </button>

                <button type="button" onclick="clearHistory()" class="btn btn-css btn-secondary">
                    
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash-fill" viewBox="0 0 16 16">
                        <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0"/>
                    </svg>

                </button>

                <br>

                <button type="button" onclick="mainSpotted()" class="btn btn-success texto mainSpottedBtn" style="margin-top: 5px;">

                    Main Spotted!

                </button>

                <br><br>

            </div>

            <div class="col-md-4">

                <div class="">
                    <p id="mainSpotted" class="mainSpotted textoVerde"></p>
                </div>

            </div>

        </div>

        <div class="row container-css-table" style="margin-top: 20px">

            <table class="table table-striped">

                <thead>

                    <tr>
                    <th scope="col">Floor</th>
                    <th scope="col">% Chance</th>
                    </tr>

                </thead>

                <tbody>

                    <tr id="f0To4">
                    <th scope="row">0 - 4</th>
                    <td>+0%</td>
                    </tr>
                    <tr id="f5To9">
                    <th scope="row">5 - 9</th>
                    <td>+3%</td>
                    </tr>
                    <tr id="f10To14">
                    <th scope="row">10 - 14</th>
                    <td>+7%</td>
                    </tr>
                    <tr id="f15To19">
                    <th scope="row">15 - 19</th>
                    <td>+9%</td>
                    </tr>
                    <tr id="f20Plus">
                    <th scope="row">20+</th>
                    <td>+20%</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
</body>
</html>
